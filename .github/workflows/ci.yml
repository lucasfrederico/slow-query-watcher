name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: Java ${{ matrix.java }} + Spring Boot ${{ matrix.spring }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        spring: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          ./mvnw -v

      - name: Pick Spring Boot profile
        id: profile
        run: |
          if [ "${{ matrix.spring }}" = "4.0" ]; then
            echo "args=-Pspring-boot-4" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./mvnw -B -e -ntp ${{ steps.profile.outputs.args }} -pl slow-query-watcher-core -am test

      - name: Integration tests (Testcontainers Postgres + MySQL)
        run: ./mvnw -B -e -ntp ${{ steps.profile.outputs.args }} verify
