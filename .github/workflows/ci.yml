name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          ./mvnw -v

      - name: Build + unit tests
        run: ./mvnw -B -e -ntp -pl slow-query-watcher-core -am test

      - name: Integration tests (Testcontainers Postgres + MySQL)
        run: ./mvnw -B -e -ntp verify
